<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LupaX Recorder</title>
  <link rel="stylesheet" href="styles/ui.css" />
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; padding: 18px 20px; gap: 12px; background: radial-gradient(400px 220px at 100% 0%, rgba(122, 184, 245, .16), transparent 70%), var(--bg); }
    .brand b { font-size: 18px; }
    .brand .logo { width: 26px; height: 26px; }
    h1 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 0; }
    p { margin: 0; color: var(--muted); font-size: 12.5px; }
    .stage { flex: 1; display: grid; place-items: center; text-align: center; }
    .count { font: 800 76px/1 var(--font); background: linear-gradient(135deg, #7ab8f5, #cfe6ff); -webkit-background-clip: text; color: transparent; }
    .time { font: 800 40px/1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--red); margin-right: 8px; vertical-align: middle; animation: blink 1.1s infinite; }
    .dot.paused { background: var(--amber); animation: none; }
    @keyframes blink { 50% { opacity: .35; } }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; height: 40px; }
    .err { color: var(--red); font-weight: 600; font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="brand"><i data-logo="26"></i><b>Lupa<span>X</span></b></div>
  <div>
    <h1 id="title">Record screen</h1>
    <p id="desc">Choose what to share in Chrome’s picker.</p>
  </div>
  <div class="stage" id="stage"><span class="spin"></span></div>
  <p class="err" id="err"></p>
  <div class="row" id="controls" hidden>
    <button class="btn" id="pause"><i data-icon="pause"></i>Pause</button>
    <button class="btn primary" id="stop"><i data-icon="stop"></i>Stop &amp; save</button>
  </div>
  <button class="cta" id="retry" hidden><i data-icon="monitor"></i>Choose again</button>
  <style>.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--brand-100);border-top-color:var(--brand);animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
  <script type="module" src="recorder.js"></script>
</body>
</html>
