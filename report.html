<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Accessibility report · LupaX</title>
  <link rel="stylesheet" href="styles/ui.css" />
  <style>
    .hero { display: grid; grid-template-columns: 300px 1fr; gap: 18px; margin-bottom: 18px; }
    .score { padding: 20px; display: flex; gap: 18px; align-items: center; }
    .donut { position: relative; width: 132px; height: 132px; flex: none; }
    .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .donut .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .donut .c b { font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
    .donut .c span { font-size: 12px; color: var(--ink-2); font-weight: 600; margin-top: 3px; }
    .stats { flex: 1; }
    .stat { display: flex; align-items: center; gap: 8px; min-height: 40px; border-bottom: 1px solid var(--line); font-weight: 650; }
    .stat:last-child { border-bottom: 0; }
    .stat .ico { width: 19px; height: 19px; }
    .stat span { flex: 1; }
    .summary { padding: 20px; }
    .summary h2 { margin: 0 0 6px; font-size: 16px; font-weight: 800; }
    .summary p { margin: 0 0 10px; color: var(--muted); }
    .summary a { word-break: break-all; }
    .check { margin-bottom: 12px; border-radius: 16px; overflow: hidden; }
    .check > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 16px 18px; cursor: pointer; }
    .check > summary::-webkit-details-marker { display: none; }
    .check > summary .ico { width: 22px; height: 22px; }
    .check .ttl { flex: 1; }
    .check .ttl b { display: block; font-size: 14.5px; font-weight: 750; }
    .check .ttl span { font-size: 12.5px; color: var(--ink-2); }
    .check .chev { transition: transform .15s; color: var(--ink-2); }
    .check[open] .chev { transform: rotate(90deg); }
    .rows { border-top: 1px solid var(--line); }
    .r { display: grid; grid-template-columns: minmax(160px, 1.1fr) 2fr auto; gap: 14px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
    .r:last-child { border-bottom: 0; }
    .r code { font: 600 12px var(--mono); color: var(--brand); background: var(--brand-50); padding: 3px 7px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .r .d b { display: block; font-weight: 650; }
    .r .d span { color: var(--muted); }
    .is-r { color: var(--red); } .is-y { color: var(--amber); } .is-g { color: var(--green); }
    .tip { color: var(--muted); font-size: 12.5px; padding: 0 18px 14px; }
    @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .r { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="page-shell">
  <header class="page-top">
    <a class="brand" href="#"><i data-logo="30"></i><b style="font-size:19px">LupaX</b></a>
    <span class="spacer"></span>
    <button class="btn" id="rescan"><i data-icon="refresh"></i>Rescan</button>
    <button class="btn primary" id="export"><i data-icon="download"></i>Export JSON</button>
  </header>
  <div class="page-body">
    <h1 class="page-title">Accessibility Insights</h1>
    <p class="page-sub">Automated WCAG 2.2 checks. Automated testing catches part of the picture — always confirm with manual review.</p>
    <div id="root"><div class="empty">Running checks…</div></div>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="report.js"></script>
</body>
</html>
